
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Daños</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <div class="titulo">
            I.E. MARÍA CANO | Sistema de Gestión de Daños
        </div>

        <div class="usuario">
            Usuario: admin_general • En Línea
        </div>
    </header>

    <div class="barra"></div>
<br><br><br>
    <main>
        <div class="login">

            <h3>INICIAR SESIÓN</h3>

            <form id="form-ingreso">
                <input type="text" id="usuario" placeholder="USUARIO">

                <input type="password" id="contrasena" placeholder="CONTRASEÑA" minlength="8" maxlength="20">

                <select id="rol">
                    <option value="">SELECCIONE SU ROL</option>
                    <option value="administrador">Administrador</option>
                    <option value="delegado">Delegado</option>
                </select>

                <input type="submit" value="INGRESAR AL SISTEMA">
            </form>

        </div>
    </main>
<script src="script.js"></script>
</body>
</html>
